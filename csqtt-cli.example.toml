# Пример файла настроек csqtt-cli.
#
# Где лежит настоящий:
#   Windows — %APPDATA%\csqtt-cli\profiles.toml
#   Linux   — ~/.config/csqtt-cli/profiles.toml
#
# Обычно его пишет `csqtt-cli profile set`, и руками править незачем. Секретов
# в нём нет: пароль подключения и хеши звонков VK лежат в хранилище секретов,
# а здесь — только ссылки на них.

# Какой профиль брать, если имя не названо. Когда профиль один, можно не писать.
default_profile = "home"

[profile.home]
# Сервер CSQTT. Без порта — 46000. IPv6 — в скобках: "[2001:db8::1]:46000".
peer = "203.0.113.10:46000"
# Ссылки на секреты; их пишет `csqtt-cli profile set`.
password_ref = "dpapi:8f2a1c"
vk_hashes_ref = "dpapi:1c9bd4"
# Идентификатор устройства для сервера. Заводится при первой записи профиля;
# менять не надо: сервер может закрепить пароль за первым устройством.
device_id = "3f9c2a71d04be658"

# Дальше — необязательное; пропущенное берётся по умолчанию.

# tun — весь трафик системы (нужны права администратора), socks — только
# программы, которым указан прокси. По умолчанию — tun.
datapath = "socks"
# Воркеров — группами по 9, от 9 до 126, не больше 27 на хеш. По умолчанию — 18.
workers = 18
# Маскировка: audio или video. По умолчанию — audio.
obfs = "audio"
# До TURN: udp или tcp_tls (если UDP в сети душат). По умолчанию — udp.
turn_transport = "udp"

[profile.home.socks]
# Адрес SOCKS5 — только loopback. По умолчанию — 127.0.0.1:1080.
listen = "127.0.0.1:1080"
