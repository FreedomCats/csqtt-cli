# Пример файла настроек csqtt-cli.
#
# Где лежит настоящий:
#   Linux   — ~/.config/csqtt-cli/profiles.toml ($XDG_CONFIG_HOME/csqtt-cli)
#   Windows — %APPDATA%\csqtt-cli\profiles.toml
# Под sudo csqtt-cli берёт файл того, кто вызвал sudo, а не root, — всегда из
# ~/.config/csqtt-cli его домашнего каталога: свой XDG_CONFIG_HOME sudo не
# передаёт. Другой файл — флаг -config у любой команды.
#
# Обычно его пишут меню и команды `csqtt-cli profile add` и `profile set`, и
# руками править незачем. Они переписывают файл целиком: комментарии в
# настоящем файле не сохраняются. Неизвестное поле — ошибка.
#
# Секретов в файле нет: пароль подключения, хеши звонков VK и токен VK лежат в
# хранилище секретов, а здесь — только ссылки на них.

# Какой профиль брать, если имя не названо. Когда профиль один, можно не писать.
default_profile = "home"

# Вход в VK для режима auto_js — один на все профили. Секцию пишут
# `csqtt-cli vk login` и `vk logout`; руками её заводить незачем, поэтому
# здесь она закомментирована. Самого токена в файле нет — только ссылка на
# него в хранилище секретов.
# [vk]
# token_ref = "dpapi:5e07b3"
# user_id = "123456789"

[profile.home]
# Сервер CSQTT 2.1.9. Без порта — 46000. IPv6 — в скобках: "[2001:db8::1]:46000".
peer = "203.0.113.10:46000"
# Ссылки на секреты; их пишут `csqtt-cli profile add`, `profile set -password`
# и `profile set -hashes`. Вид ссылки зависит от хранилища: dpapi:… на Windows,
# secretservice:… (связка ключей) или file:… (secrets.json с правами 0600) на Linux.
password_ref = "dpapi:8f2a1c"
vk_hashes_ref = "dpapi:1c9bd4"
# Откуда звонок VK. manual — ссылки на звонки профиля (vk_hashes_ref).
# auto_js — звонок создаёт ядро от имени аккаунта VK, в который вошли
# `csqtt-cli vk login`; vk_hashes_ref тогда не нужен, а заданный остаётся на
# случай возврата к manual. При остановке и перед переподключением созданный
# звонок завершается. Риски для аккаунта — в README, раздел «Вход в VK».
# Переключить: `csqtt-cli profile set home -vk-hash-mode auto_js`.
# По умолчанию — manual.
vk_hash_mode = "manual"
# Устройство для сервера. Заводится при первой записи профиля, дальше не
# меняется. Сервер CSQTT закрепляет пароль за первым устройством, которое с
# ним подключилось: новый device_id для него — чужое устройство.
# Значение здесь выдуманное: device_id заводит сама программа, копировать его
# из примера не надо — иначе две машины для сервера станут одним устройством.
device_id = "3f9c2a71d04be658"

# Дальше — необязательное; пропущенное берётся по умолчанию.

# tun — весь трафик системы: нужны права root (sudo), пока только Linux.
# socks — только программы, которым указан прокси; прав не нужно, работает и
# на Windows. По умолчанию — tun.
datapath = "socks"
# Воркеров — группами по 9, от 9 до 126; больше 27 на один звонок ядро не
# берёт, в auto_js — не больше 72. По умолчанию — 18.
workers = 18
# Маскировка RTP: audio или video. По умолчанию — audio.
obfs = "audio"
# До TURN: udp или tcp_tls (если UDP в сети душат). По умолчанию — udp.
turn_transport = "udp"
# Kill-switch для tun: пока туннель не поднят, трафик системы заблокирован.
# По умолчанию включён; false — трафик между попытками идёт мимо туннеля.
# На один запуск выключает флаг -no-kill-switch.
kill_switch = true

[profile.home.socks]
# Адрес SOCKS5 для datapath = "socks" — только loopback: пароля у прокси нет.
# По умолчанию — 127.0.0.1:1080.
listen = "127.0.0.1:1080"
